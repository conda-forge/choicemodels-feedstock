{% set name = "choicemodels" %}
{% set version = "0.3" %}
{% set sha256 = "b89f3c47f1295f243fa9a24f3e6b6075370e25805d9e95d49e281ef6b0c3f6eb" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - python
    - pip
  run:
    - python
    - numpy
    - pandas
    - patsy
    - pylogit
    - scipy
    - statsmodels

test:
  imports:
    - choicemodels

about:
  home: https://github.com/UDST/choicemodels
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Tools for discrete choice modeling
  description: Choicemodels is a Python package for discrete choice modeling
  doc_url: http://choicemodels.readthedocs.io/
  dev_url: https://github.com/UDST/choicemodels

extra:
  recipe-maintainers:
    - waddell
    - gboeing
    - smmaurer
